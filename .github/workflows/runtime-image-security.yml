name: Runtime image security

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "13 3 * * 1"

permissions:
  contents: read

concurrency:
  group: runtime-image-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan source dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: fs
          scan-ref: .
          skip-dirs: node_modules,build,.gradle,androidApp/build
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Set up isolated dependency verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify npm signatures and lifecycle-script allowlist
        run: ./.github/scripts/verify-npm-dependencies.sh

      - name: Build production image
        run: docker build --tag runtime-image:ci .

      - name: Verify minimized Node runtime
        run: |
          docker run --rm --entrypoint sh runtime-image:ci -ec '
            node --version >/dev/null
            ! command -v npm >/dev/null
            test ! -d /usr/local/lib/node_modules/npm
          '

      - name: Smoke-test Sharp runtime
        run: >-
          docker run --rm --entrypoint node runtime-image:ci
          -e 'const sharp=require("sharp");sharp({create:{width:1,height:1,channels:4,background:{r:0,g:0,b:0,alpha:1}}}).png().toBuffer().then(b=>{if(!b.length)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})'

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: runtime-image:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-moments-landingpage-${{ github.sha }}
          path: sbom*.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero HIGH and CRITICAL vulnerabilities
        run: |
          set -Eeuo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f \
            image --quiet --scanners vuln --severity HIGH,CRITICAL \
            --format json runtime-image:ci > trivy.json
          critical=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy.json)
          high=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy.json)
          printf 'Trivy: %s CRITICAL, %s HIGH\n' "$critical" "$high" | tee -a "$GITHUB_STEP_SUMMARY"
          if (( critical != 0 || high != 0 )); then
            echo 'Production image must remain free of HIGH and CRITICAL vulnerabilities.' >&2
            exit 1
          fi

